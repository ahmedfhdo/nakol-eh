# Build, test and deploy to GitHub Pages on every push to the default branch.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch: # allows a manual run from the Actions tab

# Least privilege: read the code, write to Pages, and an OIDC token that
# deploy-pages uses to prove the deployment came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; a newer push cancels a queued older one,
# but a deployment already in progress is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm ci` installs exactly what's in package-lock.json (fails if it's out of sync).
      - run: npm ci

      # A failing test or type error stops the deploy — the live site keeps the last good version.
      - run: npm test
      - run: npm run check
      - run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
